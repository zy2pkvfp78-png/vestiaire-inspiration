<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f2"><title>Vestiaire à coudre — Inspirations</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f2;color:#242321;font-family:Arial,Helvetica,sans-serif}header{background:#f7f5f2;border-bottom:1px solid #dfddd8;padding:24px 16px 16px;position:sticky;top:0;z-index:2}.kicker{font-size:10px;letter-spacing:2.2px;text-transform:uppercase}h1{font-family:Georgia,serif;font-weight:400;font-size:32px;margin:8px 0 20px}button,.btn{background:#292826;color:#fff;padding:11px 12px;font-size:13px;border:0;border-radius:5px;cursor:pointer;display:inline-block}button.alt,.btn.alt{background:#e6e2dc;color:#292826}.buttons{display:flex;gap:8px;flex-wrap:wrap}input[type=file]{display:none}main{padding:16px;max-width:1150px;margin:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.filters input{grid-column:span 2}.filters input,.filters select{width:100%;padding:12px;border-radius:5px;border:1px solid #d4d0ca;background:#fff;min-width:0}.grid{columns:2;column-gap:12px}.item{break-inside:avoid;background:white;border-radius:6px;overflow:hidden;margin:0 0 12px;box-shadow:0 1px 5px #00000010}.item img{display:block;width:100%;height:auto}.details{padding:10px;font-size:12px}.details strong{display:block;word-break:break-word}.details small{color:#666}.details button{padding:7px 9px;margin-top:8px}.empty{text-align:center;padding:72px 15px;color:#777;line-height:1.7}dialog{width:calc(100% - 28px);max-width:440px;max-height:94vh;overflow-y:auto;border:0;border-radius:12px;padding:19px;box-shadow:0 12px 60px #0006}dialog::backdrop{background:#0009}dialog img{width:100%;max-height:35vh;object-fit:contain;background:#eee}label.field{display:block;margin-top:13px;font-size:13px}label.field input,label.field select,label.field textarea{display:block;width:100%;padding:11px;border:1px solid #ccc;border-radius:5px;margin-top:5px;font:inherit}textarea{min-height:70px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}footer{text-align:center;color:#777;font-size:11px;padding:20px}@media(min-width:650px){.grid{columns:4}h1{font-size:38px}}
</style></head><body><header><div class="kicker">Vestiaire à coudre</div><h1>Atelier d’inspirations</h1><div class="buttons"><label for="photos" class="btn">＋ Ajouter des photos</label><input id="photos" type="file" accept="image/*" multiple><button id="export" class="alt">Sauvegarder</button><label class="btn alt" for="restore">Restaurer</label><input id="restore" type="file" accept=".json,application/json"></div></header><main><div class="filters"><input id="search" placeholder="Rechercher une inspiration…"><select id="filterType"><option value="">Tous les vêtements</option></select><select id="filterBoard"><option value="">Toutes les planches</option></select></div><div id="grid" class="grid"></div><div id="empty" class="empty">Ajoute une capture d’écran pour commencer ta bibliothèque d’inspirations.</div></main><footer>Les photos restent dans ce navigateur sur cet appareil. Pense à sauvegarder régulièrement.</footer><dialog id="modal"><form id="editor"><img id="preview" alt="Aperçu"><label class="field">Nom<input id="name" required maxlength="100"></label><label class="field">Type de vêtement<select id="type"><option>Blouse / Haut</option><option>Pantalon</option><option>Jupe</option><option>Robe</option><option>Veste / Manteau</option><option>Silhouette</option><option>Détail technique</option><option>Autre</option></select></label><label class="field">Planche de tendances<input id="board" placeholder="Ex. Blouses structurées"></label><label class="field">Mots-clés<input id="tags" placeholder="pinces, volume, minimalisme"></label><label class="field">Notes<textarea id="notes" placeholder="Ce qui m’inspire dans ce modèle…"></textarea></label><div class="actions"><button type="button" class="alt" id="del">Supprimer</button><div><button type="button" class="alt" id="cancel">Annuler</button> <button type="submit">Enregistrer</button></div></div></form></dialog><script>
const el=id=>document.getElementById(id);let db,items=[],selected=null;const request=indexedDB.open("vac-inspirations",1);request.onupgradeneeded=()=>request.result.createObjectStore("images",{keyPath:"id"});request.onsuccess=()=>{db=request.result;load()};request.onerror=()=>alert("Stockage bloqué. Ouvre l’application dans Safari.");
function obj(write=false){return db.transaction("images",write?"readwrite":"readonly").objectStore("images")}
function load(){const r=obj().getAll();r.onsuccess=()=>{items=r.result.sort((a,b)=>b.id-a.id);render()}}
function put(x){const r=obj(true).put(x);r.onsuccess=load;r.onerror=()=>alert("Impossible d’enregistrer cette photo. Vérifie l’espace libre sur ton appareil.")}
function updateOptions(id,vals,placeholder){const s=el(id),v=s.value;s.replaceChildren(new Option(placeholder,""));[...new Set(vals.filter(Boolean))].sort().forEach(x=>s.add(new Option(x,x)));s.value=v}
function render(){updateOptions("filterType",items.map(x=>x.type),"Tous les vêtements");updateOptions("filterBoard",items.map(x=>x.board),"Toutes les planches");const q=el("search").value.toLowerCase(),t=el("filterType").value,b=el("filterBoard").value;const filtered=items.filter(x=>(!t||x.type===t)&&(!b||x.board===b)&&[x.name,x.type,x.board,x.tags,x.notes].join(" ").toLowerCase().includes(q));el("grid").replaceChildren();el("empty").style.display=filtered.length?"none":"block";for(const x of filtered){const article=document.createElement("article");article.className="item";const img=document.createElement("img");img.src=x.data;img.loading="lazy";img.alt=x.name;const d=document.createElement("div");d.className="details";const strong=document.createElement("strong");strong.textContent=x.name;const small=document.createElement("small");small.textContent=[x.type,x.board].filter(Boolean).join(" · ");const btn=document.createElement("button");btn.className="alt";btn.textContent="Voir / Modifier";btn.onclick=()=>edit(x.id);d.append(strong,small,btn);article.append(img,d);el("grid").append(article)}}
function edit(id){selected=id;const x=items.find(y=>y.id===id);if(!x)return;el("preview").src=x.data;for(const k of ["name","type","board","tags","notes"])el(k).value=x[k]||"";el("modal").showModal()}
el("editor").onsubmit=e=>{e.preventDefault();const x=items.find(y=>y.id===selected);if(x)put({...x,...Object.fromEntries(["name","type","board","tags","notes"].map(k=>[k,el(k).value.trim()]))});el("modal").close()};el("cancel").onclick=()=>el("modal").close();el("del").onclick=()=>{if(confirm("Supprimer cette inspiration ?")){obj(true).delete(selected).onsuccess=load;el("modal").close()}};
for(const id of ["search","filterType","filterBoard"])el(id).addEventListener(id==="search"?"input":"change",render);
function imageData(file){return new Promise((res,rej)=>{const reader=new FileReader();reader.onerror=rej;reader.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const c=document.createElement("canvas"),ratio=Math.min(1,1400/img.width,1400/img.height);c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};img.src=reader.result};reader.readAsDataURL(file)})}
el("photos").onchange=async e=>{for(const f of [...e.target.files]){try{const data=await imageData(f);put({id:Date.now()+Math.random(),data,name:f.name.replace(/\.[^.]+$/,""),type:"Autre",board:"",tags:"",notes:""})}catch{alert("Impossible de lire : "+f.name)}}e.target.value=""};
el("export").onclick=()=>{const a=document.createElement("a");const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,items})],{type:"application/json"}));a.href=url;a.download="vestiaire-inspirations-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
el("restore").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw Error();if(!confirm("Importer "+d.items.length+" inspirations ?"))return;const tr=db.transaction("images","readwrite");for(const x of d.items)if(x.id&&x.data)tr.objectStore("images").put(x);tr.oncomplete=load;tr.onerror=()=>alert("Erreur pendant la restauration")}catch{alert("Sauvegarde non reconnue")}e.target.value=""};
</script></body></html>
